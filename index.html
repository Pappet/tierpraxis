<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4FA89A">
<title>Tierpraxis</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2F3A45;--mint:#4FA89A;--mint2:#BFE6DC;--wand:#FFF4E4;--rosa:#FF8FB1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mint)}
body{font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  background:var(--mint);z-index:6}
.sign{font-weight:700;font-size:26px;color:#fff;display:flex;align-items:center;gap:10px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.stats{display:flex;gap:10px;align-items:center}
.chip{background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:22px;border:none;
  box-shadow:0 3px 0 rgba(0,0,0,.15);font-family:inherit;color:inherit;min-height:48px;min-width:48px}
#home{font-size:26px;padding:4px 14px}
#home.aus{visibility:hidden}

/* ---------- Szenen ---------- */
#buehne{position:relative;flex:1;overflow:hidden;touch-action:none}
.szene{position:absolute;inset:0;display:none}
.szene.an{display:flex}

/* Wartezimmer */
#warte{flex-direction:column;background:
  linear-gradient(#FFF4E4 0 72%,#E9C99B 72% 74%,#D8B07A 74%);}
#fenster{position:absolute;left:5%;top:6%;width:min(22vw,220px);aspect-ratio:1.2;border:10px solid #fff;border-radius:14px;
  background:linear-gradient(#9ED8F5,#D8F1FF);box-shadow:0 4px 0 rgba(0,0,0,.08);overflow:hidden;font-size:min(6vw,56px)}
#fenster span{position:absolute;left:12%;top:10%}
#fenster .wolke{left:auto;right:6%;top:38%;animation:wolke 9s ease-in-out infinite alternate}
@keyframes wolke{to{transform:translateX(-60%)}}
#bild{position:absolute;right:7%;top:8%;width:min(14vw,140px);aspect-ratio:.85;background:#FFD6E4;border:8px solid #C99A6B;
  border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:min(7vw,64px)}
#pflanze{position:absolute;left:1%;bottom:17vh;font-size:min(10vw,96px)}
#bank{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:space-evenly;padding:0 2vw 3vh;gap:1vw}
.patient{position:relative;flex:1;max-width:32vw;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:transform .2s}
.patient svg{width:100%;height:auto;max-height:42vh;pointer-events:none}
.patient .kissen{width:90%;height:26px;border-radius:50%;background:#FF9EC0;margin-top:-18px;box-shadow:0 5px 0 #E87BA0}
.patient.dran{animation:hopp 1.6s ease-in-out infinite}
.blase{position:absolute;top:-4%;right:4%;background:#fff;border-radius:50%;width:clamp(64px,9vw,96px);
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(36px,5vw,54px);
  box-shadow:0 4px 0 rgba(0,0,0,.12);pointer-events:none}
.blase:after{content:"";position:absolute;bottom:-8px;left:22%;border:10px solid transparent;border-top:14px solid #fff;border-bottom:0}
#fotowand{height:18vh;min-height:90px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;overflow:hidden}
.foto{height:88%;aspect-ratio:1.15;background:#fff;padding:6px 6px 14px;border-radius:6px;
  box-shadow:0 4px 8px rgba(0,0,0,.2);transform:rotate(var(--r));flex:none}
.foto svg{width:100%;height:100%;background:#DFF3EE;border-radius:3px}
.foto.neu{animation:reinflattern .8s ease-out}

/* Behandlungsraum */
#raum{flex-direction:column;background:
  radial-gradient(circle at 50% 38%,#E8F7F3 0 30%,transparent 60%),
  linear-gradient(#D6EFEA 0 70%,#B9DDD5 70%)}
#tischwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#tier{height:100%;max-height:100%;width:auto;max-width:96%;aspect-ratio:400/332;touch-action:none;overflow:visible}
#tisch{position:absolute;left:50%;transform:translateX(-50%);bottom:3%;width:min(70%,700px);height:5%;
  background:#fff;border-radius:18px;box-shadow:0 8px 0 #9CC9BF;pointer-events:none}
#ablage{flex:none;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.55);min-height:112px}
.werkzeug{width:92px;height:92px;border-radius:24px;background:#fff;border:none;display:flex;align-items:center;
  justify-content:center;font-size:54px;box-shadow:0 5px 0 rgba(0,0,0,.14);padding:0;touch-action:none;position:relative}
.werkzeug svg{width:68px;height:68px;pointer-events:none}
.werkzeug.dran{animation:puls 1.3s ease-in-out infinite;box-shadow:0 0 0 6px #FFD84D,0 5px 0 rgba(0,0,0,.14)}
.werkzeug.wackel{animation:wackel .5s ease-in-out 3}
.werkzeug.weg{opacity:.35}
.werkzeug.fertig{background:#5BC26B;color:#fff;font-size:58px;font-weight:700;width:120px}
#ghost{position:fixed;z-index:50;pointer-events:none;font-size:80px;width:100px;height:100px;margin:-50px 0 0 -50px;
  display:none;align-items:center;justify-content:center;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
#ghost svg{width:84px;height:84px}
.teilchen{position:fixed;z-index:40;pointer-events:none}
.blubb{width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.4);animation:blubb .8s ease-out forwards}
.tropf{width:10px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#5AB4F0;animation:tropf .6s ease-in forwards}
.luft{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.95);animation:luft .5s ease-out forwards}
.glitzer{font-size:28px;animation:blubb .9s ease-out forwards}
.herz{font-size:44px;animation:herz 1.4s ease-out forwards}
#konfetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.konf{position:absolute;top:-20px;width:14px;height:20px;border-radius:3px;animation:fall 2.4s linear forwards}

/* Start */
#start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 40%,#8FD6C8,#4FA89A)}
#start .big{font-size:120px;animation:hopp 1.6s ease-in-out infinite}
#start h1{margin:0;color:#fff;font-size:56px;text-shadow:0 4px 0 rgba(0,0,0,.15)}
#go{font-family:inherit;font-size:64px;border:none;border-radius:999px;background:#FFD84D;color:var(--ink);
  width:180px;height:120px;box-shadow:0 8px 0 #D9AE1D;animation:puls 1.3s ease-in-out infinite}

@keyframes hopp{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes puls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wackel{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes blubb{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@keyframes tropf{0%{transform:translateY(0);opacity:1}100%{transform:translateY(90px);opacity:0}}
@keyframes luft{0%{transform:translateX(0);opacity:1}100%{transform:translateX(var(--dx));opacity:0}}
@keyframes herz{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1;transform:translateY(-20px) scale(1)}100%{transform:translateY(-160px) scale(1.2);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes reinflattern{0%{transform:translateY(-60vh) rotate(-20deg)}100%{transform:rotate(var(--r))}}
@keyframes freude{0%,100%{transform:translateY(0)}30%{transform:translateY(-8%)}60%{transform:translateY(0)}}
#tier.freude{animation:freude .7s ease-in-out 2}
#tier.mampf .maul{animation:mampf .25s ease-in-out 6}
@keyframes mampf{50%{transform:scaleY(.4)}}

/* Bilder-Modus (assets/ vorhanden) */
body.bilder #warte{background:#FFF4E4 url(./assets/bg-warte.webp) center bottom/cover no-repeat}
body.bilder #raum{background:#D6EFEA url(./assets/bg-raum.webp) center bottom/cover no-repeat}
body.bilder #fenster,body.bilder #bild,body.bilder #pflanze{display:none}
body.bilder .patient .kissen{background:#FFB3CC;box-shadow:0 5px 0 #E88FAE}
.wabbel{animation:wabbel 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glitzern{animation:glitzern 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pochen{animation:pochen 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes wabbel{0%,100%{transform:scale(1)}50%{transform:scale(1.08,.94)}}
@keyframes glitzern{0%,100%{transform:translateY(0);filter:brightness(1)}50%{transform:translateY(-3px);filter:brightness(1.25)}}
@keyframes pochen{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
.weg-anim{position:fixed;z-index:45;pointer-events:none;animation:puff .7s ease-out forwards}
.weg-anim.plopp{animation:plopp .8s cubic-bezier(.3,1.4,.6,1) forwards}
@keyframes puff{to{transform:scale(1.6);opacity:0}}
@keyframes plopp{30%{transform:translate(10px,-70px) rotate(-30deg)}100%{transform:translate(40px,-40px) rotate(-120deg) scale(.4);opacity:0}}
#schichtA,#schichtB{position:fixed;z-index:5;pointer-events:none;display:none}
#schichtB{mix-blend-mode:multiply}
#hopvid{position:fixed;z-index:30;pointer-events:none;display:none;object-fit:contain}
#hopser{position:fixed;z-index:30;pointer-events:none;display:none;background-repeat:no-repeat;background-size:3600% 100%}
#hopser.an{display:block;animation:hopsen 3s steps(35) forwards}
@keyframes hopsen{from{background-position:0 0}to{background-position:100% 0}}

@media (orientation:portrait){
  #bank{flex-wrap:wrap;align-content:flex-end;padding-bottom:2vh}
  .patient{max-width:48vw;flex-basis:46%}
  .patient svg{max-height:28vh}
  #fotowand{height:14vh}
  #tier{width:100%;height:auto;max-height:100%}
  .werkzeug{width:96px;height:96px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="chip aus" id="home" aria-label="Wartezimmer">🏠</button>
    <div class="sign">🐾 Tierpraxis</div>
    <div class="stats">
      <span class="chip" id="sterneChip">⭐ <b id="sterne">0</b></span>
      <button class="chip" id="fs" aria-label="Vollbild">⛶</button>
    </div>
  </header>
  <div id="buehne">
    <section class="szene an" id="warte">
      <div id="fenster"><span>☀️</span><span class="wolke">☁️</span></div>
      <div id="bild">🐾</div>
      <div id="pflanze">🪴</div>
      <div id="bank"></div>
      <div id="fotowand"></div>
    </section>
    <section class="szene" id="raum">
      <div id="tischwrap"><svg id="tier" viewBox="0 -20 400 332"></svg></div>
      <div id="ablage"></div>
    </section>
  </div>
</div>
<div id="ghost"></div>
<div id="hopser"></div>
<canvas id="schichtA"></canvas><canvas id="schichtB"></canvas>
<video id="hopvid" muted playsinline preload="auto"></video>
<div id="konfetti"></div>
<div id="start"><div class="big">🐶</div><h1>Tierpraxis</h1><button id="go" aria-label="Los">▶</button></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const SAVE_KEY = 'tierpraxis-spielstand';
const S = {sterne:0, behandelt:0, fotos:[], bekannt:['hund','katze']};
let patienten = [], aktiv = null, rundeFertig = 0;

function load(){ try{ Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')); }catch(e){} }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
const rnd = a => a[Math.floor(Math.random()*a.length)];
const mischen = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ================= Ton ================= */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d=.12, type='sine', vol=.16, delay=0, slide=0){
  const a = ac(); if(!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(f*slide, t+d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01);
  g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.03);
}
function rauschen(d=.25, freq=2000, vol=.06){
  const a = ac(); if(!a) return;
  const n = Math.floor(a.sampleRate*d), b = a.createBuffer(1, n, a.sampleRate), c = b.getChannelData(0);
  for(let i=0;i<n;i++) c[i] = (Math.random()*2-1) * (1 - i/n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const SFX = {
  pop:   () => tone(520, .1, 'sine', .2, 0, 1.8),
  klick: () => tone(700, .06, 'triangle', .12),
  nope:  () => tone(210, .14, 'square', .04),
  ding:  () => { tone(1318, .4, 'sine', .15); tone(1760, .5, 'sine', .1, .08); },
  jubel: () => [523,659,784,1047].forEach((f,i) => tone(f, .2, 'triangle', .16, i*.1)),
  schnipp: () => { tone(2400, .04, 'square', .05); tone(1800, .05, 'square', .04, .05); },
  plopp: () => tone(300, .15, 'sine', .25, 0, 2.5),
  mampf: () => [0,.25,.5].forEach(d => tone(180, .08, 'triangle', .14, d)),
  quietsch: () => tone(900, .08, 'sine', .06, 0, 1.3),
  wasser: () => rauschen(.3, 3500, .07),
  wind:   () => rauschen(.3, 900, .08),
  fanfare: () => [523,659,784,659,784,1047].forEach((f,i) => tone(f, .22, 'triangle', .15, i*.13))
};

/* ================= Sprache: eine Warteschlange ================= */
const Voice = (() => {
  const HAS = 'speechSynthesis' in window;
  let voice = null, queue = [], playing = false, epoch = 0;
  function pick(){ if(!HAS) return; voice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('de')) || null; }
  if(HAS){ pick(); speechSynthesis.onvoiceschanged = pick; }
  const est = (t, r) => Math.min(12000, 900 + (t.length / Math.max(.5, r)) * 90);
  function speakOne(item){
    return new Promise(res => {
      if(!HAS) return res();
      let done = false; const fin = () => { if(!done){ done = true; clearTimeout(wd); res(); } };
      const u = new SpeechSynthesisUtterance(item.text);
      u.lang = 'de-DE'; if(voice) u.voice = voice; u.rate = item.rate || .92; u.pitch = item.pitch || 1.12;
      u.onend = fin; u.onerror = fin;
      const wd = setTimeout(fin, est(item.text, u.rate));
      speechSynthesis.speak(u);
    });
  }
  async function run(){
    if(playing) return; playing = true; const mine = epoch;
    while(queue.length && mine === epoch){
      const it = queue.shift();
      if(it.text) await speakOne(it);
      if(it.pause && mine === epoch) await new Promise(r => setTimeout(r, it.pause));
    }
    if(mine === epoch) playing = false;
  }
  const norm = x => typeof x === 'string' ? {text:x} : x;
  return {
    say(items){ queue.push(...[].concat(items).filter(Boolean).map(norm)); run(); },
    flush(){ epoch++; queue = []; playing = false; if(HAS) speechSynthesis.cancel(); },
    replace(items){ this.flush(); this.say(items); }
  };
})();

/* ================= Bilder (assets/) =================
   Liegt der Ordner assets/ neben dem Spiel, werden die gemalten Bilder benutzt.
   Fehlt er, zeichnet das Spiel die Tiere selbst (SVG). */
const ASSET_DIR = './assets/';
let BILDER = false;
const bilderBereit = new Promise(res => {
  const im = new Image();
  im.onload = () => { BILDER = true; document.body.classList.add('bilder'); res(true); };
  im.onerror = () => res(false);
  im.src = ASSET_DIR + 'hund-normal.webp';
});
/* Vermessene Punkte in den Bildern (viewBox-Einheiten 0 -20 400 320):
   feet = Pfoten/Hufe von links nach rechts, mund, body = Stellen am Körper für Schlamm/Knoten */
const BILD_GEO = {
  hund:   {feet:[[77,274],[151,274],[258,274],[309,274]], mund:[312,116],
           body:[[214,152],[100,200],[278,192],[140,138]]},
  katze:  {feet:[[97,275],[173,275],[276,275],[328,275]], mund:[316,126],
           body:[[208,166],[116,206],[276,192],[146,144]]},
  pony:   {feet:[[118,277],[181,277],[265,277],[310,277]], mund:[309,131],
           body:[[195,157],[117,143],[262,196],[88,200]]},
  hase:   {feet:[[125,281],[181,281],[262,281],[311,281]], mund:[302,158],
           body:[[202,182],[100,175],[250,212],[146,210]]},
  einhorn:{feet:[[129,277],[189,277],[271,277],[311,277]], mund:[310,132],
           body:[[187,155],[88,205],[260,200],[108,130]]}
};
/* Umrisse der gemalten Tiere (200×160, lauflängenkodiert, aus den *-normal.webp berechnet).
   Damit weiß das Spiel, wo Fell ist, ohne die Bilder auslesen zu müssen. */

/* Geometrie je Tier (viewBox 0 -20 400 320, Boden bei y≈285) */
function geo(art){
  if(art === 'pony' || art === 'einhorn') return {
    body:[178,150,102,50], legTop:160, legBottom:270, legW:24, legsX:[138,110,248,222],
    head:[318,62], mund:[318,112], huf:true };
  if(art === 'hase') return {
    body:[180,188,92,66], head:[270,116], mund:[270,142],
    legsX:[128,160,248,272], legTop:0, legBottom:0, feetY:282 };
  if(art === 'katze') return {
    body:[185,178,96,50], legTop:185, legBottom:276, legW:24, legsX:[140,114,258,234],
    head:[298,118], mund:[298,142] };
  return {body:[188,170,100,56], legTop:176, legBottom:276, legW:28, legsX:[146,116,264,236],
    head:[300,106], mund:[300,134] };
}
function fuesse(art){
  const g = geo(art);
  if(art === 'hase') return [[128,282],[160,284],[236,283],[258,284]];
  return g.legsX.map(x => [x, g.legBottom + (g.huf ? 8 : 4)]);
}
function darker(hex, f=.82){
  const n = parseInt(hex.slice(1),16);
  const c = [n>>16, (n>>8)&255, n&255].map(v => Math.round(v*f));
  return '#' + c.map(v => v.toString(16).padStart(2,'0')).join('');
}

/* ---- Zeichnen ---- */
function gesicht(cx, cy, stimmung, T, gross=1){
  const e = 17*gross, ey = cy-6*gross;
  let s = '';
  if(stimmung === 'froh'){
    s += `<path d="M${cx-e-8},${ey+2} q8,-10 16,0 M${cx+e-8},${ey+2} q8,-10 16,0" stroke="#2B2B2B" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  } else {
    for(const x of [cx-e, cx+e]){
      s += `<circle cx="${x}" cy="${ey}" r="8" fill="#2B2B2B"/><circle cx="${x+3}" cy="${ey-3}" r="3" fill="#fff"/>`;
    }
    if(stimmung !== 'normal'){
      s += `<path d="M${cx-e-10},${ey-12} l15,-6 M${cx+e+10},${ey-12} l-15,-6" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round"/>`;
    }
  }
  if(stimmung === 'krank' || stimmung === 'froh'){
    const c = stimmung === 'krank' ? '#FF5A5A' : '#FF9EB5';
    s += `<ellipse cx="${cx-e-12}" cy="${ey+18}" rx="9" ry="6" fill="${c}" opacity=".7"/><ellipse cx="${cx+e+12}" cy="${ey+18}" rx="9" ry="6" fill="${c}" opacity=".7"/>`;
  }
  if(stimmung === 'krank') s += `<path d="M${cx+e+22},${ey-18} q6,10 0,14 q-6,-4 0,-14z" fill="#8FD0FF"/>`;
  return s;
}
function maul(cx, cy, stimmung){
  if(stimmung === 'froh')
    return `<g class="maul" style="transform-origin:${cx}px ${cy}px"><path d="M${cx-12},${cy-2} q12,16 24,0 z" fill="#C2405A" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"/></g>`;
  if(stimmung === 'normal')
    return `<g class="maul" style="transform-origin:${cx}px ${cy}px"><path d="M${cx-10},${cy-2} q5,6 10,0 q5,6 10,0" stroke="#2B2B2B" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
  return `<g class="maul" style="transform-origin:${cx}px ${cy}px"><path d="M${cx-9},${cy+4} q9,-9 18,0" stroke="#2B2B2B" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
}

function fussMalen(x, y, T, huf, lack, far){
  const f = far ? darker(T.fell,.85) : T.fell;
  if(huf){
    return `<rect x="${x-16}" y="${y-10}" width="32" height="18" rx="5" fill="${lack||'#4A3A33'}" stroke="${lack?darker(lack,.75):'#2E2420'}" stroke-width="2"/>`;
  }
  return `<ellipse cx="${x+4}" cy="${y}" rx="20" ry="10" fill="${f}"/>`;
}
function krallen(x, y, lang, lack){
  const c = lack || '#F4F1EA', st = lack ? darker(lack,.7) : '#B8B2A6';
  let s = '';
  for(let i=0;i<3;i++){
    const bx = x + 12 + i*6, by = y + 2 - i*3;
    s += lang
      ? `<path d="M${bx},${by-3} l18,${4+i} l-18,${5}" fill="${c}" stroke="${st}" stroke-width="1.5" stroke-linejoin="round"/>`
      : `<path d="M${bx+4},${by-3} l7,3 l-7,4" fill="${c}" stroke="${st}" stroke-width="1.5" stroke-linejoin="round"/>`;
  }
  return s;
}

/* ================= Schichten: Schmutz und Zotteln über dem ganzen Tier =================
   Jede Schicht ist ein eigenes Zahlenfeld (200×160 = viewBox/2, Werte 0..1). Reiben verändert
   nur diese Zahlen; die Bildpunkte der Grafiken werden nie ausgelesen. Dadurch läuft das auch,
   wenn das Spiel direkt als Datei geöffnet wird (dort verbietet Chrome das Auslesen von Bildern).
   Schwamm: Schlamm weg, Schaum hin. Dusche: Schaum weg, Nässe hin. Föhn: Nässe weg. Bürste: Zotteln weg. */
const Schicht = (() => {
  const MW = 200, MH = 160, N = MW*MH, TEX = {}, R = 18;
  const sx = x => x/2, sy = y => (y+20)/2;
  function lade(n){ return TEX[n] || (TEX[n] = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = ASSET_DIR + n + '.webp'; })); }
  const MASKEN = {};
  function silhouette(art){
    if(MASKEN[art]) return MASKEN[art];
    const m = new Uint8Array(N), code = (typeof BILD_MASKE !== 'undefined') && BILD_MASKE[art];
    if(code){
      let i = 0, pos = 0, v = 0;
      while(i < code.length){
        let n;
        if(code.startsWith('zz', i)){ n = parseInt(code.substr(i+2, 3), 36); i += 5; }
        else { n = parseInt(code.substr(i, 2), 36); i += 2; }

      for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) if(((x-95)/80)**2 + ((y-85)/62)**2 < 1) m[y*MW+x] = 1;

    const sil = silhouette(p.art), S = {sil, flaeche: summe(sil), m:{}, stand:{}};
    const [fx, fy, fr] = gesicht(p);
    const gesichtFrei = f => { for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){ const d = Math.hypot(x-fx, y-fy); if(d < fr) f[y*MW+x] *= Math.min(1, Math.max(0, (d - fr*.55)/(fr*.45))); } };
    if(p.ziele.some(z => z.art === 'schmutz')){
      const f = new Float32Array(N);
      for(let k=0;k<36;k++){
        const u = Math.random();
        pinsel(f, sil, 20 + Math.random()*150, 55 + Math.pow(u, .6)*100, 10 + Math.random()*16, 2);
      }
      BILD_GEO[p.art].feet.forEach(([a,b]) => pinsel(f, sil, sx(a), sy(b)-8, 16, 2));
      gesichtFrei(f);
      S.m.schlamm = f; S.m.schaum = new Float32Array(N); S.m.nass = new Float32Array(N);

    } else if(t === 'dusche' && m.schaum){

      if(anteil(S,'schlamm') < .3) pinsel(m.schlamm, S.sil, mx, my, R, -.08*mehr);
      pinsel(m.nass, S.sil, mx, my, R+3, .25*mehr); tat = true;
    } else if(t === 'foehn' && m.nass){

    } else if(t === 'buerste' && m.zottel){

      const w = Math.max(1, Math.round(L.w*dpr*.7)), h = Math.max(1, Math.round(L.h*dpr*.7));

const PROBLEME = {
  schlamm: {blase:'🛁'},

function problemeFuer(art){
  const huf = art === 'pony' || art === 'einhorn';
  return Object.keys(PROBLEME).filter(k => !(huf && k === 'kralle'));
}
function stufe(){ return Math.min(3, Math.floor(S.behandelt / 3)); }

function neuerPatient(art){
  const st = stufe();
  const anzahl = st === 0 ? 1 : st === 1 ? (Math.random() < .5 ? 1 : 2) : st === 2 ? 2 : (Math.random() < .3 ? 3 : 2);
  const probs = mischen(problemeFuer(art)).slice(0, anzahl);
  const p = {art, probleme:probs, ziele:[], pflaster:[], deko:[], lack:{}, phase:'behandlung', gesagt:{}};
  const g = geo(art), P = punkte(art), F = P.feet;
  const add = (a, x, y, extra={}) => { const k = KETTE[a]; p.ziele.push({art:a, x, y, hp:k.hp, max:k.hp, r:k.r, ...extra}); };
  for(const pr of probs){
    if(pr === 'schlamm' && BILDER){
      p.ziele.push({art:'schmutz', x:0, y:0, hp:1, max:1, r:0});
    } else if(pr === 'knoten' && BILDER){
      p.ziele.push({art:'zottel', x:0, y:0, hp:1, max:1, r:0});
    } else if(pr === 'schlamm'){
      P.body.forEach(([x,y]) => add('schlamm', x, y));
    } else if(pr === 'dorn'){
      const [x,y] = F[3]; add('dorn', x, y-4, {fuss:3, nagel:g.huf});
    } else if(pr === 'knoten'){
      P.body.slice(0,3).forEach(([x,y],i) => add('knoten', x + (i===1?6:-6), y - 14));
    } else if(pr === 'kralle'){
      F.forEach(([x,y],i) => add('kralle', x+(BILDER?20:22), y-(BILDER?4:0), {fuss:i}));
    } else if(pr === 'fieber'){
      add('fieber', P.mund[0], P.mund[1]);
    }
  }
  // Schlamm und Knoten dürfen nicht übereinanderliegen
  if(probs.includes('schlamm') && probs.includes('knoten')){
    p.ziele.filter(z => z.art === 'knoten').forEach((z,i) => { z.y -= 34; z.x += 22; });
  }
  return p;
}

function ansage(p){
  const T = TIERE[p.art], teile = [];
  for(const pr of p.probleme){
    if(pr === 'schlamm') teile.push(`${T.Der} hat sich im Schlamm gewälzt! Zuerst mit dem Schwamm einseifen.`);
    if(pr === 'dorn') teile.push(p.ziele.find(z=>z.nagel) || (p.art==='pony'||p.art==='einhorn')
      ? `Oh je, ${T.Der.toLowerCase()} hat einen Nagel im Huf. Zieh ihn mit der Zange raus.`
      : `Aua! ${T.Der} hat einen Dorn in der Pfote. Zieh ihn mit der Zange raus.`);
    if(pr === 'knoten') teile.push(`Das Fell ist ganz verknotet. Bürste es schön glatt!`);
    if(pr === 'kralle') teile.push(`Die Krallen sind viel zu lang. Schneide sie mit der Schere.`);
    if(pr === 'fieber') teile.push(`${T.Der} ist krank. Miss zuerst Fieber mit dem Thermometer. Halt es an den Mund.`);
  }
  return teile.map(t => ({text:t, pause:350}));
}

function szene(id){ document.querySelectorAll('.szene').forEach(s => s.classList.toggle('an', s.id === id)); if(id !== 'raum') Schicht.verstecken(); }

function schichtErsatz(p){
  const P = punkte(p.art);

                            : z.art === 'zottel' ? P.body.slice(0,3).map(([x,y]) => ({art:'knoten', x, y:y-14, hp:KETTE.knoten.hp, max:KETTE.knoten.hp, r:KETTE.knoten.r}))
                            : [z]);
}
async function behandeln(p){

    try{ Schicht.anlegen(p); }catch(e){ console.warn('Schicht', e); schichtErsatz(p); }
  }

  else if(p.phase === 'leckerli') Voice.replace(`Zur Belohnung gibt es ein Leckerli! Zieh es zum Mund.`);

function naechstesTool(){

function ablage(){

  if(aktiv.phase === 'behandlung'){
    const noetig = new Set();
    for(const pr of aktiv.probleme){
      let k = pr === 'dorn' ? 'dorn' : pr;
      while(k){ noetig.add(KETTE[k].tool); k = KETTE[k].next; }
    }
    // (Schichten nutzen dieselben Werkzeuge wie die Ketten schlamm/knoten)
    const st = stufe();
    const extra = st >= 2 ? TOOL_REIHE.length : st === 1 ? 3 : 2;
    const rest = mischen(TOOL_REIHE.filter(t => !noetig.has(t))).slice(0, extra);
    const set = new Set([...noetig, ...rest]);
    tools = TOOL_REIHE.filter(t => set.has(t));
  } else if(aktiv.phase === 'leckerli'){
    tools = ['leckerli'];

  let getroffen = false;

  if(drag.t.startsWith('lack')){
    const F = punkte(aktiv.art).feet;
    F.forEach(([x,y],i) => {
      if(Math.hypot(p.x-x-(BILDER?14:8), p.y-y) < 34 && aktiv.lack[i] !== LACKE[+drag.t.slice(4)]){
        aktiv.lack[i] = LACKE[+drag.t.slice(4)]; SFX.quietsch(); glitzer(drag.x, drag.y+GHOST_DY); zeichne();
      }
    });
  } else if(aktiv.phase !== 'schmuck'){
    if(aktiv.schicht && Schicht.reiben(aktiv, drag.t, p.x, p.y, bew, dt)){
      getroffen = true; effekt(drag.t, drag.x, drag.y + GHOST_DY, now);
    }
    for(let i = 0; i < aktiv.ziele.length; i++){
      const z = aktiv.ziele[i], k = KETTE[z.art];
      if(!k) continue;
      if(Math.hypot(p.x - z.x, p.y - z.y) > z.r + 22) continue;
      if(k.tool !== drag.t) continue;
      getroffen = true;
      z.hp -= bew * k.rub + k.hold * dt;
      effekt(drag.t, drag.x, drag.y + GHOST_DY, now);
      if(z.hp <= 0){ zielFertig(i); break; }
      const el = $('zg'+i); if(el) el.setAttribute('opacity', .3 + .7*Math.max(0,z.hp)/z.max);
    }
    if(!getroffen && aufTier && bew > 0 && aktiv.phase === 'behandlung'){
      drag.falsch += bew;
      if(drag.falsch > 260 && now - tippT > 7000){
        const n = naechstesTool();
        if(n && n !== drag.t){ tippT = now; SFX.nope(); Voice.say(`Hmm, probier mal ${TOOLS[n].den}.`); wackeln(n); }
        drag.falsch = 0;
      }
    }
  }
  requestAnimationFrame(schleife);
}
function effekt(t, x, y, now){
  if(now - tonT < 220) return; tonT = now;
  if(t === 'schwamm'){ SFX.quietsch(); for(let i=0;i<3;i++) teilchen('blubb', x, y); }
  else if(t === 'dusche'){ SFX.wasser(); for(let i=0;i<5;i++) teilchen('tropf', x-20+Math.random()*40, y+20); }
  else if(t === 'foehn'){ SFX.wind(); for(let i=0;i<3;i++) teilchen('luft', x+20, y-10+Math.random()*20); }
  else if(t === 'buerste'){ SFX.quietsch(); teilchen('glitzer', x, y, '✨'); }
  else if(t === 'thermo'){ tone(1200 + Math.random()*200, .05, 'sine', .06); }
  else if(t === 'salbe'){ SFX.quietsch(); }
  else if(t === 'zange'){ tone(400, .05, 'triangle', .06); }
}
function teilchen(cls, x, y, txt){
  const s = document.createElement('div'); s.className = 'teilchen ' + cls;
  s.style.left = x + 'px'; s.style.top = y + 'px';
  s.style.setProperty('--dx', (Math.random()*80-40) + 'px'); s.style.setProperty('--dy', (-30 - Math.random()*50) + 'px');
  if(cls === 'luft') s.style.setProperty('--dx', '-90px');
  if(txt) s.textContent = txt;
  document.body.appendChild(s); setTimeout(() => s.remove(), 1500);
}
function glitzer(x, y){ for(let i=0;i<5;i++) teilchen('glitzer', x, y, '✨'); }
function herzen(){
  const r = $('tier').getBoundingClientRect();
  for(let i=0;i<6;i++) setTimeout(() => teilchen('herz', r.left + r.width*(.35+Math.random()*.4), r.top + r.height*.35, '❤️'), i*140);
}

function zielFertig(i){
  const z = aktiv.ziele[i], k = KETTE[z.art];
  const bild = svgZuBild(z.x, z.y);
  if(z.art === 'dorn'){ SFX.plopp(); } else if(z.art === 'kralle'){ SFX.schnipp(); krallenFall(bild); } else SFX.ding();
  glitzer(bild.x, bild.y);
  wegEffekt(z);
  if(k.bleibt === 'pflaster') aktiv.pflaster.push([z.x, z.y - 4]);
  if(k.next){
    const n = KETTE[k.next];
    aktiv.ziele[i] = {...z, art:k.next, hp:n.hp, max:n.hp, r:n.r};
    if(!aktiv.gesagt[k.next]){ aktiv.gesagt[k.next] = 1; let s = STUFEN_SATZ[k.next];
      if(k.next === 'wunde' && z.nagel) s = s.replace('er ist raus', 'der Nagel ist raus');
      if(k.next === 'wunde' && !z.nagel) s = s.replace('er ist raus', 'der Dorn ist raus');
      Voice.say(s); }
  } else {
    aktiv.ziele.splice(i, 1);
  }
  if(z.art === 'leckerli'){ leckerliGegessen(); return; }
  zeichne(); markiere();
  if(aktiv.ziele.length === 0 && aktiv.phase === 'behandlung') gesund();
}
function gesund(){
  const T = TIERE[aktiv.art];
  aktiv.phase = 'leckerli';
  SFX.jubel(); herzen();
  $('tier').classList.remove('freude'); void $('tier').offsetWidth; $('tier').classList.add('freude');
  const schoen = aktiv.probleme.every(p => p === 'knoten' || p === 'kralle' || p === 'schlamm');
  Voice.say([{text: schoen ? `Wunderschön! ${T.Der} ist ganz glücklich.` : `Geschafft! ${T.Der} ist wieder gesund.`, pause:250},
             'Zur Belohnung gibt es ein Leckerli. Zieh es zum Mund.']);
  const P = punkte(aktiv.art);
  aktiv.ziele = [{art:'leckerli', x:P.mund[0], y:P.mund[1], hp:1, max:1, r:KETTE.leckerli.r}];
  zeichne(); ablage();
  hopsen();
}
function leckerliGegessen(){
  SFX.mampf(); aktiv.phase = 'schmuck'; zeichne();
  $('tier').classList.add('mampf'); setTimeout(() => $('tier').classList.remove('mampf'), 1600);
  herzen();
  Voice.say(['Mmmh, lecker!', {text:'Jetzt darfst du schmücken und die Krallen lackieren. Wenn du fertig bist, drück den grünen Haken.', pause:0}]);
  if(aktiv.art === 'pony' || aktiv.art === 'einhorn') { /* Hufe lackieren geht auch */ }
  ablage();
}
function fertig(){
  if(!aktiv) return;
  const p = aktiv, T = TIERE[p.art];
  p.phase = 'fertig';
  S.sterne++; S.behandelt++;
  S.fotos.push({art:p.art, deko:p.deko, lack:p.lack, pflaster:p.pflaster});
  if(S.fotos.length > 30) S.fotos = S.fotos.slice(-30);
  save(); $('sterne').textContent = S.sterne;
  SFX.fanfare(); herzen();
  $('tier').classList.remove('freude'); void $('tier').offsetWidth; $('tier').classList.add('freude');
  Voice.replace([`Tschüss, ${T.name}! Danke für deine Hilfe.`]);
  rundeFertig++;
  setTimeout(() => {
    zeigeWarte(); fotowand(true);
    if(patienten.every(q => q.phase === 'fertig')){
      konfetti(); SFX.jubel();
      Voice.say([{text:'Alle Tiere sind wieder gesund! Toll gemacht!', pause:600}]);
      setTimeout(neueRunde, 3800);
    } else Voice.say('Wer ist als Nächstes dran?');
  }, 1800);
}
function konfetti(){
  const k = $('konfetti'); const farben = ['#FF8FB1','#FFD84D','#4FB8E8','#8FD6A0','#A67CF2'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div'); c.className = 'konf';
    c.style.left = Math.random()*100 + 'vw'; c.style.background = rnd(farben);
    c.style.animationDelay = Math.random()*.8 + 's'; k.appendChild(c); setTimeout(() => c.remove(), 3500);
  }
}

/* Schmuck antippen = wieder abnehmen */
$('tier').addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-deko]'); if(!t || !aktiv || aktiv.phase !== 'schmuck') return;
  aktiv.deko.splice(+t.dataset.deko, 1); SFX.pop(); zeichne(); markiere(); idleReset();
});

/* ---- Tipps nach Wartezeit ---- */
let idleT = null;
function idleReset(){
  clearTimeout(idleT);
  idleT = setTimeout(tipp, 13000);
}
function wackeln(t){
  const b = document.querySelector(`.werkzeug[data-t="${t}"]`); if(!b) return;
  b.classList.remove('wackel'); void b.offsetWidth; b.classList.add('wackel');
}
const TIPP = {zange:'zieh damit', schere:'tipp damit die Krallen an', pflaster:'kleb es drauf', thermo:'halt es an den Mund', medizin:'gib sie in den Mund'};
function tipp(){
  if(drag) return idleReset();
  if(!aktiv){ Voice.say('Tipp ein Tier an!'); }
  else if(aktiv.phase === 'behandlung'){
    const n = naechstesTool();
    if(n){ wackeln(n); Voice.say(`Nimm ${TOOLS[n].den} und ${TIPP[n] || 'reib damit über das Tier'}.`); }
  }
  else if(aktiv.phase === 'leckerli'){ wackeln('leckerli'); Voice.say('Zieh das Leckerli zum Mund.'); }
  else { wackeln('fertig'); }
  idleReset();
}

/* ================= Rahmen ================= */
$('home').addEventListener('click', () => { ac(); SFX.klick(); Voice.flush(); zeigeWarte(); });
let resetT;
$('sterneChip').addEventListener('pointerdown', () => { resetT = setTimeout(() => {
  if(confirm('Spielstand wirklich zurücksetzen?')){ localStorage.removeItem(SAVE_KEY); location.reload(); }
}, 3000); });
['pointerup','pointerleave','pointercancel'].forEach(ev => $('sterneChip').addEventListener(ev, () => clearTimeout(resetT)));
$('fs').addEventListener('click', () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
});
$('go').addEventListener('click', async () => {
  ac(); document.documentElement.requestFullscreen?.().catch(()=>{});
  await Promise.race([bilderBereit, new Promise(r => setTimeout(r, 1500))]);
  $('start').remove();
  Voice.say([{text:'Willkommen in der Tierpraxis!', pause:300}]);
  neueRunde();
});
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', () => { if(aktiv && $('raum').classList.contains('an')) Schicht.zeigen(aktiv); });
load(); $('sterne').textContent = S.sterne;
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
